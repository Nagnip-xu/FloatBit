name: 构建 FloatBit 安装包

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 选择要构建的平台
        type: choice
        default: both
        options: [both, android, windows]

permissions:
  contents: read

jobs:
  android:
    if: inputs.platform != 'windows'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: 测试并构建 APK
        working-directory: FloatBit_Android
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FloatBit-Android
          path: FloatBit_Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: 保存 Android 布局验证图与测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FloatBit-Android-Checks
          path: |
            FloatBit_Android/app/build/reports/overlay/*.png
            FloatBit_Android/app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn

  windows:
    if: inputs.platform != 'android'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      npm_config_registry: https://registry.npmjs.org/
      ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - name: 静默安装、覆盖升级、启动与卸载验证
        run: ./build/smoke-install.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: FloatBit-Windows
          path: desktop/dist/*.exe
          if-no-files-found: error
