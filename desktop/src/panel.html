<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-color="green-up">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FloatBit 主面板</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <!-- 自定义标题栏 -->
  <header class="topbar">
    <div class="brand">
      <span class="logo">◈</span>
      <span class="brand-name">FloatBit</span>
      <span class="brand-sub">实时加密货币行情</span>
    </div>
    <div class="win-actions">
      <button class="win-btn" id="theme-toggle" title="切换主题">🌙</button>
      <button class="win-btn" id="win-min" title="最小化">—</button>
      <button class="win-btn win-close" id="win-close" title="关闭">✕</button>
    </div>
  </header>

  <main class="content">
    <!-- 我的自选 -->
    <section class="block">
      <div class="block-head">
        <h2>我的自选</h2>
        <span class="muted" id="watch-count">0 个</span>
      </div>
      <div class="watch-list" id="watch-list"></div>
      <p class="empty-hint hidden" id="watch-empty">还没有自选，去下面添加热门币种吧</p>
    </section>

    <!-- 搜索添加 -->
    <section class="block">
      <div class="block-head">
        <h2>添加合约</h2>
      </div>
      <div class="search-box">
        <input type="text" id="search-input" placeholder="搜索合约，如 BTC、MU、SNDK、SKHYNIX…" autocomplete="off" />
        <span class="search-icon">🔍</span>
      </div>
      <div class="search-results" id="search-results"></div>
      <div class="symbols-meta"><span id="symbols-status" role="status">正在更新合约列表…</span><button id="refresh-symbols" type="button">刷新</button></div>
    </section>

    <!-- 热门币种 -->
    <section class="block">
      <div class="block-head">
        <h2>热门币种</h2>
        <span class="muted">点击即可添加</span>
      </div>
      <div class="hot-grid" id="hot-grid"></div>
    </section>

    <!-- 显示设置 -->
    <section class="block">
      <div class="block-head">
        <h2>显示设置</h2>
      </div>
      <div class="setting-row">
        <label>涨跌配色</label>
        <div class="seg" id="color-seg">
          <button data-color="green-up">🟢 涨 / 🔴 跌</button>
          <button data-color="red-up">🔴 涨 / 🟢 跌</button>
        </div>
      </div>
      <div class="setting-row">
        <label>不透明度</label>
        <input type="range" id="opacity-input" min="40" max="100" step="5" />
        <span class="range-val" id="opacity-val">95%</span>
      </div>
      <div class="setting-row">
        <label>悬浮窗置顶</label>
        <label class="switch">
          <input type="checkbox" id="ontop-input" />
          <span class="slider"></span>
        </label>
      </div>
      <div class="setting-row">
        <button class="link-btn" id="show-float">显示 / 唤回悬浮窗</button>
      </div>
    </section>

    <p class="foot-note">价格来自币安 USDⓈ-M 合约公共接口，无需密钥。</p>
    <p class="author">作者：Nagnip · <a href="mailto:xu814667@gmail.com" id="author-mail">xu814667@gmail.com</a></p>
  </main>

  <!-- 提示条 -->
  <div class="toast" id="toast"></div>

  <script src="markets.js"></script>
  <script src="panel.js"></script>
</body>
</html>
